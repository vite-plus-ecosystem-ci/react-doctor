packages:
  - "packages/*"

minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - "@oxc-parser/*"
  - "@oxc-project/*"
  - "@oxc-resolver/*"
  - "@oxlint-tsgolint/*"
  - "@oxlint/*"
  - "oxc-*"
  - "oxlint"
  - "oxlint-*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint-tsgolint
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
trustPolicy: no-downgrade
trustPolicyExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - semver@6.3.1
blockExoticSubdeps: true

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@sentry/cli"
  - esbuild
  - unrs-resolver
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.e0f77ee2353b38c77d7165d3305f9f6d705b4d62
  vitest: 5.0.1
  vite-plus: 0.0.0-commit.e0f77ee2353b38c77d7165d3305f9f6d705b4d62
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
