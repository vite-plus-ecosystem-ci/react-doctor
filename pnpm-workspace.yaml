packages:
  - "packages/*"

minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - "@oxc-parser/*"
  - "@oxc-project/*"
  - "@oxc-resolver/*"
  - "@oxlint-tsgolint/*"
  - "@oxlint/*"
  - "oxc-*"
  - "oxlint"
  - "oxlint-*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint-tsgolint
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
trustPolicy: no-downgrade
# Ecosystem-ci smoke test only: preview builds are published by the registry
# bridge without provenance attestation, which trips the no-downgrade check.
# Real vite-plus npm releases are published with provenance.
trustPolicyExclude:
  - vite-plus
  - "@voidzero-dev/*"
  # pnpm cross-major false positive (pnpm/pnpm#10202): an earlier-published
  # version on another major carries provenance this one lacks.
  - semver
blockExoticSubdeps: true

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@sentry/cli"
  - esbuild
  - unrs-resolver
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642
  vitest: 4.1.11
  vite-plus: 0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
