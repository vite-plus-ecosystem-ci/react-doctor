packages:
  - "packages/*"

minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
  - "@oxc-project/*"
  # ecosystem-ci smoke test: preview builds carry no provenance and are brand new
  - vite-plus
  - "@voidzero-dev/*"
  - agent-install
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
trustPolicy: no-downgrade
blockExoticSubdeps: true

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
trustPolicyExclude:
  # ecosystem-ci smoke test: preview builds carry no provenance and are brand new
  - vite-plus
  - "@voidzero-dev/*"
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@sentry/cli"
  - esbuild
  - unrs-resolver
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.824e84de80cbc1af30829ed024a4158d416dbad3
  vitest: 5.0.4
  vite-plus: 0.0.0-commit.824e84de80cbc1af30829ed024a4158d416dbad3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
